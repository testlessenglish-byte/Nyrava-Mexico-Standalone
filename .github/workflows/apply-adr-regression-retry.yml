name: Retry targeted ADR regression fixes

on:
  push:
    branches:
      - agent/adr-regression-only

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/adr-regression-only
          fetch-depth: 0
      - name: Run corrected one-shot patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/apply-adr-regression-fix.yml').read_text()
          block = source.split("python3 - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          code = textwrap.dedent(block)
          code = code.replace(
              "if s.count(impact_marker) < 2: raise SystemExit('impact markers missing')",
              "if s.count(impact_marker) < 1: raise SystemExit('impact marker missing')",
          )
          code = code.replace("s = s.replace(impact_marker, impact_new, 2)", "s = s.replace(impact_marker, impact_new, 1)")
          exec(compile(code, '<adr-regression-patch>', 'exec'), {'__name__': '__main__'})
          Path('.github/workflows/apply-adr-regression-retry.yml').unlink(missing_ok=True)
          PY
      - name: Commit focused fixes
        shell: bash
        run: |
          git config user.name "Nyrava Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix ADR report regressions [adr-regression-applied]"
          git push origin HEAD:agent/adr-regression-only
