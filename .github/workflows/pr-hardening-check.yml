name: Launch hardening checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run launch-hardening regressions
        run: >-
          bunx vitest run
          src/lib/intelligence/__tests__/recommendation-grounding.test.ts
          src/lib/intelligence/__tests__/verified-scoring-amparo.test.ts
          src/lib/intelligence/__tests__/witness-person-safety.test.ts
          src/lib/intelligence/__tests__/report-canonical-context-sanitization.test.ts
          src/lib/intelligence/__tests__/finding-selection-quarantine.test.ts
          src/lib/intelligence/__tests__/stale-data-guard-coverage.test.ts
          src/lib/reporting/attorney-workproduct.test.ts
          src/lib/reporting/objective.test.ts
          src/lib/canonical/__tests__/rendered-report-release.test.ts

      - name: Build production bundle
        run: bun run build
