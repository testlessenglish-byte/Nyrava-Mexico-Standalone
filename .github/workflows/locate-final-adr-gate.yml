name: Locate final ADR gate
on:
  push:
    branches: [agent/final-adr-root-fix]
permissions:
  contents: read
jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-adr-root-fix
      - name: Locate gate and notification paths
        run: |
          echo '=== allowMotionGeneration ==='
          grep -R -n -C 8 "allowMotionGeneration" src || true
          echo '=== fullAnalysisOverride ==='
          grep -R -n -C 8 "fullAnalysisOverride" src || true
          echo '=== concluded_audit ==='
          grep -R -n -C 4 "concluded_audit" src/lib/pipeline.server.ts src/lib/pipeline-runner.server.ts src/lib/intelligence || true
